# obs-stream-metadata — MediaMTX mínimo de producto (ADR-016).
# Fuente canónica: tools/mediamtx.yml (el instalador lo copia a
# data/obs-plugins/obs-stream-metadata/relay/). El plugin gobierna el
# proceso hijo y fija el forward vía Control API :9997 (formato F-096).
# Puertos fijos: RTMP 1935 (destino operador rtmp://127.0.0.1:1935/live),
# Control API 127.0.0.1:9997, path "live" con source publisher.
# Todo lo demás apagado para superficie mínima (igual que lab T-078).
logLevel: info
logDestinations: [stdout]

api: true
apiAddress: 127.0.0.1:9997

metrics: false
pprof: false
playback: false

rtsp: false
rtmp: true
rtmpAddress: :1935
hls: false
webrtc: false
srt: false
moq: false

paths:
  live:
    source: publisher
    # Avisos por evento (Fase 1): el plugin observa
    # %TEMP%/obs-stream-metadata-relay esperando signal.on
    # (emisor en linea) y signal.off (emisor fuera de linea).
    # runOnOnline se termina con SIGINT al dejar de estar online;
    # runOnOffline corre al dejar de estar online.
    # Variables disponibles en ambos (igual que runOnAvailable):
    # $MTX_PATH (nombre del path), $MTX_QUERY, $MTX_SOURCE_TYPE,
    # $MTX_SOURCE_ID, $RTSP_PORT. Aqui solo se usa el dir fijo de
    # senales; MTX_PATH queda documentada para futuros usos.
    # Windows [C: upstream internal/externalcmd/cmd_os_windows.go]:
    # si el comando empieza por "cmd ", MediaMTX pasa el resto como
    # linea cruda a cmd.exe. $VAR la expande MediaMTX (os.Expand);
    # %VAR% la expande cmd desde el entorno heredado (ahi viajan
    # tambien MTX_PATH y demas). Comandos one-shot: no hay proceso
    # persistente que terminar al caer el stream.
    runOnOnline: 'cmd /c "mkdir "%TEMP%\obs-stream-metadata-relay" 2>nul & echo online> "%TEMP%\obs-stream-metadata-relay\signal.on" & del /F /Q "%TEMP%\obs-stream-metadata-relay\signal.off" 2>nul"'
    runOnOffline: 'cmd /c "mkdir "%TEMP%\obs-stream-metadata-relay" 2>nul & echo offline> "%TEMP%\obs-stream-metadata-relay\signal.off" & del /F /Q "%TEMP%\obs-stream-metadata-relay\signal.on" 2>nul"'
