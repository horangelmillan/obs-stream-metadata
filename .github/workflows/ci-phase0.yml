name: ci-phase0

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  phase0-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files exist
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f .gitignore
          test -f docs/STATE.md
          test -f docs/WORKFLOW.md
          test -f docs/TOOLS.md
          test -f docs/RESEARCH.md
          test -f docs/GIT.md
          test -f docs/BACKLOG.md
          test -f docs/FINDINGS.md
          test -f docs/PHASES.md
          test -f docs/VALIDATION.md
          test -f docs/SECURITY.md
          test -f docs/TROUBLESHOOTING.md

      - name: P4 product gate (provider code lives in src/)
        run: |
          test -f buildspec.json
          test -f CMakeLists.txt
          test -f src/plugin-main.c
          test -f src/metadata.h
          test -f src/metadata_dock.h
          if grep -rEI '(client_secret|refresh_token|access_token)[[:space:]]*=[[:space:]]*["A-Za-z0-9_.-]{8,}' src/ cmake/ CMakeLists.txt CMakePresets.json buildspec.json ; then echo "secret value in product code"; exit 1; fi
          echo "p4 product gate ok"

      # Escanea valores con pinta de secreto (asignaciones, prefijos conocidos,
      # claves PEM), no menciones documentales de nombres como `access_token`.
      - name: Secret scan (values, not doc words)
        run: |
          PAT="(gh[pousr]_[A-Za-z0-9]{16,}|sk-[A-Za-z0-9]{8,}|AIza[A-Za-z0-9_-]{10,}|BEGIN [A-Z ]*PRIVATE KEY|(client_secret|refresh_token|access_token)[[:space:]]*=[[:space:]]*[\"A-Za-z0-9_.-]{8,})"
          if grep -rEI "$PAT" --exclude-dir=.git . ; then echo "possible secret value in tree"; exit 1; fi
          echo "secret scan ok"

  # T-054: la batería backend (stdlib-only) corre en CI. Sin credenciales,
  # sin red, sin providers reales: solo garantías locales + fail-fasts.
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Backend test suite
        run: python -m unittest discover -s backend/tests
