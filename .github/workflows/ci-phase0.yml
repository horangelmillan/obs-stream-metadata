name: ci-phase0

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  phase0-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files exist
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f .gitignore
          test -f docs/STATE.md
          test -f docs/WORKFLOW.md
          test -f docs/TOOLS.md
          test -f docs/RESEARCH.md
          test -f docs/GIT.md
          test -f docs/BACKLOG.md
          test -f docs/FINDINGS.md
          test -f docs/PHASES.md
          test -f docs/VALIDATION.md
          test -f docs/SECURITY.md
          test -f docs/TROUBLESHOOTING.md

      - name: No functional code yet (Phase 0 gate)
        run: |
          test ! -e src
          test ! -e CMakeLists.txt

      - name: Secret scan (diff + tree)
        run: |
          PAT='(client_secret|refresh_token|access_token|Authorization:[[:space:]]*Bearer|BEGIN [A-Z ]*PRIVATE KEY)'
          if git rev-parse --verify HEAD >/dev/null 2>&1; then RANGE="HEAD"; else RANGE=""; fi
          if grep -rEI "$PAT" --exclude-dir=.git . ; then echo "possible secret in tree"; exit 1; fi
          echo "secret scan ok"
